<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — Visões integradas</title><style>
:root{font:14px Inter,system-ui,sans-serif;color:#1e293b;background:#f5f7fb}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}.app{height:100vh;min-height:640px;display:flex;flex-direction:column}.top{height:64px;background:white;border-bottom:1px solid #e1e6ef;display:flex;align-items:center;gap:20px;padding:0 22px}.logo{font-size:20px;font-weight:800;color:#5146dc}.brand{font-weight:750}.muted{color:#8791a3;font-size:12px}.tabs{display:flex;gap:4px;margin-left:auto;overflow:auto}.tabs button{white-space:nowrap;background:transparent;border:0;border-radius:8px;padding:10px 12px;color:#64748b}.tabs button.active{background:#eeeaff;color:#5146dc;font-weight:700}.body{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;flex:1;min-height:0}.side{background:#fff;padding:18px;border-right:1px solid #e1e6ef;overflow:auto}.right{border-left:1px solid #e1e6ef;border-right:0}.heading{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8995a7;font-weight:750;margin:8px 0 15px}.search,.field{width:100%;border:1px solid #dce3ed;background:#fff;border-radius:9px;padding:10px;margin:8px 0 14px}.item{width:100%;text-align:left;border:1px solid transparent;background:white;border-radius:9px;padding:11px;display:flex;align-items:center;gap:10px;color:#344054}.item.active{background:#f0efff;border-color:#dedaff;color:#5045d5}.item .symbol{font-size:18px;color:#6e64dc}.small{font-size:12px;color:#7b8798}.main{min-width:0;overflow:auto;padding:25px 30px;background:#f7f9fc}.paper{background:white;max-width:1050px;margin:auto;border:1px solid #e5eaf1;border-radius:14px;padding:34px;box-shadow:0 4px 24px #1b2a4710}.paper h1{font-size:26px;letter-spacing:-.04em;margin:4px 0 8px}.lede{color:#64748b;line-height:1.6}.progress{height:8px;border-radius:9px;background:#e9edf5;overflow:hidden;margin:14px 0 8px}.progress>div{height:100%;background:#7367e8}.phase{border:1px solid #e2e7ef;border-radius:12px;padding:18px;margin-top:18px}.phasehead{display:flex;justify-content:space-between;align-items:center;gap:10px}.phase h3{font-size:15px;margin:0}.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-top:15px}.cell{border:1px solid #e0e5ee;border-radius:10px;background:#fff;text-align:left;padding:14px;min-height:95px}.cell.active{border:2px solid #7569ed;background:#f8f7ff}.cell strong{display:block;margin:7px 0}.arrow{text-align:center;color:#9ca3af;font-size:24px;margin:4px}.chip{display:inline-block;font-size:11px;background:#f0f2f7;padding:4px 8px;border-radius:15px;color:#65738a}.warn{background:#fff2d8;color:#94670e}.complete{color:#128060}.diagram{min-width:720px;width:100%;height:510px;border-radius:12px;background-color:#fff;background-image:radial-gradient(#dce3ef 1px,transparent 1px);background-size:20px 20px;border:1px solid #e1e7f0}.diagram .node{cursor:pointer}.diagram .node rect,.diagram .node circle,.diagram .node polygon{fill:#fff;stroke:#9ba8bc;stroke-width:1.5}.diagram .node.active rect,.diagram .node.active circle,.diagram .node.active polygon{fill:#f2f0ff;stroke:#6659e6;stroke-width:2.5}.diagram text{font-size:12px;fill:#344054;pointer-events:none}.diagram .edge{fill:none;stroke:#9da8ba;stroke-width:2;marker-end:url(#arr)}.tutcard{border:1px solid #e2e7ef;border-radius:14px;padding:25px;margin-top:24px}.tutcard h2{font-size:21px}.controls{display:flex;gap:10px;justify-content:space-between;margin-top:24px}.btn{border:1px solid #d9dfeb;background:#fff;border-radius:9px;padding:10px 15px;color:#344054}.btn.primary{background:#5d52d9;border-color:#5d52d9;color:white}.btn:disabled{opacity:.4;cursor:default}.right label{font-size:12px;color:#68758a;font-weight:600}.status{display:flex;gap:6px;flex-wrap:wrap}.status button{border:1px solid #dce3ed;background:#fff;padding:7px 9px;border-radius:8px;font-size:11px}.status button.active{background:#eeeaff;border-color:#857bf0;color:#5044d0}.bottom{background:white;border-top:1px solid #e1e6ef;padding:10px 22px;font-size:12px;color:#64748b;display:flex;justify-content:space-between}.note{font-size:12px;line-height:1.6;color:#6b7890;margin-top:20px}@media(max-width:1050px){.body{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:650px){.top{height:auto;min-height:60px;flex-wrap:wrap;padding:12px}.tabs{order:2;width:100%}.tabs button{padding:8px}.body{display:block;overflow:auto}.side:not(.right){display:none}.main{padding:12px}.paper{padding:18px}.bottom{padding:10px}}
</style><div class="app"><header class="top"><span class="logo">◇</span><div><div class="brand">Clean Sea <span class="muted">/ Workspace</span></div><div class="muted">Visões sincronizadas · Demonstração</div></div><nav class="tabs" id="tabs"></nav></header><div class="body"><aside class="side"><div class="heading">Estrutura · 7 fases</div><input id="search" class="search" placeholder="Buscar elementos…" aria-label="Buscar elementos"><div id="items"></div></aside><main class="main" id="main"></main><aside class="side right"><div class="heading">Inspector</div><div id="inspector"></div></aside></div><footer class="bottom"><span id="foot">Dados locais de demonstração</span><span>Fonte única: App · Estado compartilhado</span></footer></div><script>
(()=>{'use strict';const phases=['Preparação','Coleta de dados','Diagnóstico','Planejamento','Execução','Monitoramento','Entrega'];const titles=['Iniciar projeto','Definir escopo','Mapear responsáveis','Reunir documentos','Capturar conversas WhatsApp','Consolidar informações','Verificar evidências','Validar registros','Classificar dados','Identificar problemas','Analisar causas','Priorizar ações','Definir plano','Aprovar decisões','Distribuir tarefas','Executar atividades','Acompanhar resultados','Revisar indicadores','Corrigir desvios','Preparar relatório','Validar entrega','Publicar resultados','Encerrar projeto','Entregável: diagnóstico','Entregável: relatório'];const nodes=titles.map((name,i)=>({id:'E'+String(i+1).padStart(2,'0'),name,phase:Math.min(6,Math.floor(i/4)),status:i<6?'concluído':i<12?'em andamento':i===17?'em risco':'planejado',v:i%6!==4,kind:i>22?'deliverable':'task',description:'Elemento demonstrativo para visualizar o funcionamento da interface.'}));const App=window.App={data:{name:'Clean Sea',description:'Visão integrada do processo, das atividades e dos entregáveis. Os dados desta prévia são ilustrativos.',phases,nodes},state:{view:'info',sel:'E05',step:4,query:''},ent(id){return this.data.nodes.find(n=>n.id===id)},select(id){this.state.sel=id;this.state.step=Math.max(0,nodes.findIndex(n=>n.id===id));render()},edit(id,patch){Object.assign(this.ent(id),patch);render()},status(e){return e.status},stats(){return {total:nodes.length,done:nodes.filter(n=>n.status==='concluído').length}}};const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const views=[['info','Infográfico'],['tutorial','Tutorial'],['bpmn','BPMN'],['org','Organograma'],['complex','Complexo']];const $=id=>document.getElementById(id);const progress=(a,b)=>`<div class="progress"><div style="width:${b?Math.round(a/b*100):0}%"></div></div><span class="small">${a} de ${b} concluídos</span>`;function render(){ $('tabs').innerHTML=views.map(([id,name])=>`<button data-view="${id}" class="${App.state.view===id?'active':''}" aria-pressed="${App.state.view===id}">${name}</button>`).join('');const filtered=nodes.filter(n=>n.name.toLowerCase().includes(App.state.query.toLowerCase()));$('items').innerHTML=filtered.map(n=>`<button class="item ${App.state.sel===n.id?'active':''}" data-id="${n.id}"><span class="symbol">${n.status==='concluído'?'●':n.status==='em andamento'?'◐':n.status==='em risco'?'▲':'○'}</span><span>${esc(n.name)}<br><span class="small">${esc(phases[n.phase])}</span></span></button>`).join('');const e=App.ent(App.state.sel);$('inspector').innerHTML=e?`<span class="chip">${e.id} · ${esc(phases[e.phase])}</span><h2 style="font-size:19px">${esc(e.name)}</h2><label for="name">Nome</label><input class="field" id="name" value="${esc(e.name)}"><label for="desc">Descrição</label><input class="field" id="desc" value="${esc(e.description)}"><label>Estado</label><div class="status">${['planejado','em andamento','concluído','em risco'].map(st=>`<button data-status="${st}" class="${e.status===st?'active':''}">${st}</button>`).join('')}</div><p class="note">${e.v?'✓ Dado validado':'⚠ Dado pendente de validação'}</p>`:'Selecione um elemento';$('foot').textContent=`${nodes.length} elementos · ${App.stats().done} concluídos · ${nodes.filter(n=>!n.v).length} pendentes`;const main=$('main');if(App.state.view==='info'){main.innerHTML=`<article class="paper"><span class="chip">VISÃO DOCUMENTO</span><h1>Infográfico · ${App.data.name}</h1><p class="lede">${App.data.description}</p>${progress(App.stats().done,nodes.length)}${phases.map((p,i)=>{const a=nodes.filter(n=>n.phase===i);return `${i?'<div class="arrow">↓</div>':''}<section class="phase"><div class="phasehead"><h3>${String.fromCharCode(65+i)} · ${p}</h3><span class="small">${a.length} itens</span></div>${progress(a.filter(n=>n.status==='concluído').length,a.length)}<div class="cells">${a.map(n=>`<button class="cell ${App.state.sel===n.id?'active':''}" data-id="${n.id}"><span class="chip ${!n.v?'warn':''}">${n.v?esc(n.status):'⚠ a validar'}</span><strong>${esc(n.name)}</strong><span class="small">${n.id}</span></button>`).join('')}</div></section>`}).join('')}</article>`}else if(App.state.view==='tutorial'){const n=nodes[App.state.step];main.innerHTML=`<article class="paper"><span class="chip">VISÃO DOCUMENTO</span><h1>Tutorial guiado</h1><p class="lede">Percorra os elementos em sequência. A seleção é sincronizada com o Inspector.</p>${progress(App.state.step+1,nodes.length)}<section class="tutcard"><span class="chip">PASSO ${App.state.step+1} / ${nodes.length}</span><h2>${esc(n.name)}</h2><p>${esc(n.description)}</p><p class="small">Fase: ${esc(phases[n.phase])} · Estado: ${esc(n.status)}</p><div class="controls"><button class="btn" id="prev" ${App.state.step===0?'disabled':''}>← Anterior</button><button class="btn primary" id="next" ${App.state.step===nodes.length-1?'disabled':''}>Próximo →</button></div></section></article>`}else{const mode=App.state.view;const positions=nodes.map((n,i)=>{if(mode==='org')return {x:105+(i%5)*185,y:65+Math.floor(i/5)*100};if(mode==='complex')return {x:510+370*Math.cos(i*Math.PI*2/nodes.length),y:270+205*Math.sin(i*Math.PI*2/nodes.length)};return{x:90+(i%7)*150,y:75+Math.floor(i/7)*115}});let edges='';for(let i=1;i<nodes.length;i++){const a=positions[mode==='org'?Math.floor((i-1)/5):i-1],b=positions[i];edges+=`<path class="edge" d="M${a.x} ${a.y+18} L${b.x} ${b.y-18}"/>`}const shapes=nodes.map((n,i)=>{const p=positions[i],sel=App.state.sel===n.id;return `<g class="node ${sel?'active':''}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}"><rect x="${p.x-59}" y="${p.y-24}" width="118" height="48" rx="${mode==='bpmn'&&i===0?24:9}"/><text x="${p.x}" y="${p.y-3}" text-anchor="middle" font-weight="600">${esc(n.name.length>18?n.name.slice(0,17)+'…':n.name)}</text><text x="${p.x}" y="${p.y+13}" text-anchor="middle" fill="#8791a3">${n.id} · ${n.status==='concluído'?'●':n.status==='em risco'?'▲':'○'}</text></g>`}).join('');main.innerHTML=`<article class="paper" style="max-width:1200px"><span class="chip">VISÃO DIAGRAMA</span><h1>${views.find(v=>v[0]===mode)[1]}</h1><p class="lede">Selecione um nó para editar os mesmos dados no Inspector. Layout ilustrativo.</p><svg class="diagram" viewBox="0 0 1030 570" role="img" aria-label="Diagrama ${mode}"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#9da8ba"/></marker></defs>${edges}${shapes}</svg></article>`} }document.addEventListener('click',ev=>{const v=ev.target.closest('[data-view]');if(v){App.state.view=v.dataset.view;render();return}const id=ev.target.closest('[data-id]');if(id){App.select(id.dataset.id);return}const st=ev.target.closest('[data-status]');if(st){App.edit(App.state.sel,{status:st.dataset.status});return}if(ev.target.id==='prev'||ev.target.id==='next'){App.state.step=Math.max(0,Math.min(nodes.length-1,App.state.step+(ev.target.id==='next'?1:-1)));App.state.sel=nodes[App.state.step].id;render()}});document.addEventListener('change',ev=>{if(ev.target.id==='name'||ev.target.id==='desc')App.edit(App.state.sel,{[ev.target.id==='name'?'name':'description']:ev.target.value})});$('search').addEventListener('input',ev=>{App.state.query=ev.target.value;render();$('search').focus()});render()})();
</script></html>
